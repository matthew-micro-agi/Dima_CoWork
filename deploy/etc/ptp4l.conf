# fwtrial PTP client (ptp4l), DL-01, DL-25. Same settings as the bench check P-3
# (ptp4l -i eth0 -2 -s): layer-2 transport, hardware timestamps, client only.
# /etc/fwtrial/ptp4l.conf survives updates; the shipped default is ptp4l.conf.default.
[global]
clientOnly           1
network_transport    L2
time_stamping        hardware
delay_mechanism      E2E
# log a summary every 2^6 s instead of every second (journalctl -u fwtrial-ptp4l)
summary_interval     6

[eth0]
