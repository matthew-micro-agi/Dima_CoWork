# Options of fwtrial-nodeagent.service (systemd EnvironmentFile; VAR=value, no quotes).
# /etc/fwtrial/nodeagent.conf survives updates; the shipped default is nodeagent.conf.default.
# After a change: systemctl restart fwtrial-nodeagent

# HTTP port of the control interface
PORT=8080
# recordings (eMMC, setup.md section 6)
REC=/rec
# ring size limit in MB; 0 = the whole filesystem minus a 64 MB reserve
RING_MAX_MB=0
# extra trigd options (e.g. --perout 1 --dev /dev/ptp0); empty = defaults
TRIGD_ARGS=
# extra nodecap options: encoder, size, bitrate, level
NODECAP_ARGS=--enc v4l2
